    body{background:#e4dedb;color:var(--ink)}.workspace{background:#e4dedb}.topbar{height:64px;min-height:64px;background:#f3efed;border:0;padding:0 24px;justify-content:space-between}.brand-icon{display:none}.brand-logo{display:block;width:48px;height:48px;object-fit:contain;border-radius:50%;mix-blend-mode:multiply}.brand-name{font-size:17px;color:#242930;font-weight:650}.brand-sub{display:none}.developer-tools{display:flex;align-items:center;gap:14px}.developer-tools button{min-height:38px;padding:0 14px;border:1px solid #d0c9c8;border-radius:8px;background:#e6e2e1;color:#353b43;font-size:13px}.developer-tools button:hover:not(:disabled){background:#dad5d3}.developer-tools span{font-size:12px;color:#59616b}
    .shell{padding:12px;gap:12px;background:#e4dedb}.map-frame{border-radius:12px;background:#e5e9e7;box-shadow:0 3px 12px #3c323016}.panel{border-radius:12px;background:#f5f1ef;color:#292d33;box-shadow:0 3px 12px #3c323018;padding:20px 24px;grid-template-columns:minmax(160px,.9fr) minmax(220px,1fr) minmax(200px,1fr) minmax(200px,1fr);column-gap:28px;row-gap:6px;align-items:center}.panel h1,.panel>p:not(.coordinate-hint),.selected-label,.coordinate-hint{display:none}.device-section{grid-column:1;grid-row:1 / span 3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px 0 0;border-right:1px solid #d9d2d0}.device-heading{display:contents}.device-heading span{font-size:15px;font-weight:650}.device-heading button{order:2;background:#e4e0df;border:1px solid #d2cbca;border-radius:7px;color:#353b43;min-height:38px;padding:0 14px;margin-top:8px}.device-heading button:hover:not(:disabled){background:#d7d2d0;color:#252b32}.device-section .status,.device-section .status.bad,.device-section .status.good,.device-section .status.busy{order:1;font-size:12px;margin-top:7px;color:#59616b}.device-section .status.bad{color:#a63733}.device-section .status.good{color:#376b4a}.device-section .status.busy{color:#806336}.coords{grid-column:2;grid-row:1 / span 3;display:grid;grid-template-columns:1fr;gap:10px;margin:0}.coords label{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:8px;font-size:13px;color:#444b53}.coords input{height:44px;margin:0;background:#fbfaf9;color:#20262c;border:1px solid #cbcbd0;border-radius:7px;font-size:15px}.coords input::placeholder{color:#777f87}.coords input:focus-visible{outline:3px solid #a5b8db80;border-color:#8098c2}.actions{display:contents}.actions button{height:46px;min-height:46px;font-size:14px;font-weight:600;border-radius:8px;box-shadow:none}.primary:not(:disabled){grid-column:3;grid-row:2;background:#7784a9;color:white}.primary:hover:not(:disabled){background:#647398}.primary:disabled{grid-column:3;grid-row:2;background:#a7adbf;color:#424b60;opacity:.7}.secondary{grid-column:4;grid-row:2;background:#e4dedc;color:#343b43;border:1px solid #d0c8c6}.secondary:hover:not(:disabled){background:#d8d0cd}.result,.result.error{grid-column:2 / -1;grid-row:4;color:#59616b;font-size:12px;margin:4px 0 0;padding:0;border:0}.result.error{color:#a63733}.footer{grid-column:1 / -1;grid-row:5;margin:6px 0 0;padding:10px 0 0;border-top:1px solid #ddd6d3;color:#626a72}.map-theme{background:#f6f4f2;color:#30363e;border:1px solid #d4cfcd;box-shadow:0 2px 5px #0002}.map-theme:hover{background:#e8e4e2}.leaflet-control-zoom a{background:#f6f4f2!important;color:#30363e!important;border-color:#d4cfcd!important}.leaflet-control-zoom a:hover{background:#e8e4e2!important}.leaflet-control-attribution{background:#f6f4f2e8!important;color:#424950!important}.leaflet-control-attribution a{color:#315d87!important}
    @media(max-width:1100px){.workspace{height:auto;min-height:100vh}.shell{padding:10px;gap:10px}.map-frame{flex:none}#map{height:53vh;min-height:300px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px}.device-section{grid-column:1;grid-row:1;padding:0;border:0}.coords{grid-column:2;grid-row:1}.actions{display:grid;grid-column:1 / -1;grid-row:2;grid-template-columns:1fr 1fr}.actions button,.primary:disabled,.primary:not(:disabled),.secondary{grid-column:auto;grid-row:auto}.result,.result.error{grid-column:1 / -1;grid-row:3}.footer{grid-column:1 / -1;grid-row:4}}
    @media(max-width:600px){.topbar{height:auto;min-height:64px;gap:10px;flex-wrap:wrap;padding:12px 16px}.developer-tools{gap:8px}.developer-tools span{display:none}.panel{grid-template-columns:1fr}.device-section,.coords{grid-column:1;grid-row:auto}.device-section{padding-bottom:12px;border-bottom:1px solid #ddd6d3}.actions{grid-column:1;grid-row:auto;grid-template-columns:1fr}.result,.result.error,.footer{grid-column:1;grid-row:auto}.coords{width:100%;grid-template-columns:1fr}.map-frame{order:0}.panel{order:1}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="workspace">
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="jun-logo.png" alt="JUN 与狗狗书本徽标"><div><div class="brand-name">行迹实验室</div><div class="brand-sub">iPhone 定位工具</div></div></div>
    <div class="developer-tools"><button id="reveal" type="button">显示开发者模式</button><span>开启及重启请在手机确认</span></div>
  </header>
  <main class="shell">
    <section class="map-frame" aria-label="地图选点区域">
      <div id="map"></div>
      <div class="map-note">地图选点 · WGS-84</div><button id="map-theme" class="map-theme" type="button" aria-pressed="false">深色地图</button><div class="map-instruction">点击地图，放置定位标记</div>
    </section>
    <aside class="panel">
      <h1>设置手机位置</h1>
      <p>在地图上选择位置，或直接输入坐标。</p>
      <section class="device-section" aria-label="设备连接"><div class="device-heading"><span>设备连接</span><button id="check" type="button">刷新设备</button></div><div id="status" class="status busy" role="status">正在检查 USB 连接…</div></section>
      <div class="selected-label">选中的坐标</div>
      <p class="coordinate-hint">发送前请确认标记位置</p>
      <div class="coords">
        <label>纬度<input id="lat" inputmode="decimal" autocomplete="off" placeholder="例如 34.0537"></label>
        <label>经度<input id="lon" inputmode="decimal" autocomplete="off" placeholder="例如 -118.2428"></label>
      </div>
      <div class="actions">
        <button id="set" class="primary" disabled>设置为手机定位</button>
        <button id="clear" class="secondary">恢复真实定位</button>
      </div>
      <div id="result" class="result" aria-live="polite">尚未选择位置。</div>
      <div class="footer">地图中心不代表手机当前所在地。模拟位置不会产生步数，也不保证第三方 App 接受。结束后请恢复真实定位，并在苹果地图确认。</div>
    </aside>
  </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const token=document.querySelector('meta[name="location-token"]').content;
    const $=id=>document.getElementById(id);
    let connected=false,busy=false,marker=null;
    const map=L.map('map',{zoomControl:false}).setView([31.2304,121.4737],12);
    const pointIcon=L.divIcon({className:'location-pin',iconSize:[38,56],iconAnchor:[19,52],html:'<svg xmlns="http://www.w3.org/2000/svg" width="38" height="56" viewBox="0 0 38 56" aria-hidden="true"><path fill="#1479f8" d="M19 1C9.61 1 2 8.61 2 18c0 12.03 17 29 17 29s17-16.97 17-29C36 8.61 28.39 1 19 1Z"/><circle cx="19" cy="18" r="6.3" fill="#fff"/><circle cx="19" cy="52" r="3" fill="#1479f8"/></svg>'});
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    $('map-theme').onclick=()=>{const active=document.querySelector('.map-frame').classList.toggle('night-map');$('map-theme').setAttribute('aria-pressed',String(active));$('map-theme').textContent=active?'浅色地图':'深色地图'};
    function coordinates(){return {latitude:Number($('lat').value),longitude:Number($('lon').value)}}
    function valid(){if(!$('lat').value.trim()||!$('lon').value.trim())return false;const c=coordinates();return Number.isFinite(c.latitude)&&Number.isFinite(c.longitude)&&c.latitude>=-90&&c.latitude<=90&&c.longitude>=-180&&c.longitude<=180}
    function updateButton(){$('set').disabled=busy||!connected||!valid();$('check').disabled=busy;$('clear').disabled=busy;$('reveal').disabled=busy}
    function showResult(message,isError=false){$('result').textContent=message;$('result').className='result'+(isError?' error':'')}
    function setPoint(lat,lon,pan=true){$('lat').value=lat.toFixed(6);$('lon').value=lon.toFixed(6);if(marker)marker.setLatLng([lat,lon]);else marker=L.marker([lat,lon],{icon:pointIcon,alt:'选中的位置'}).addTo(map);if(pan)map.panTo([lat,lon]);showResult(`已选择：${lat.toFixed(6)}, ${lon.toFixed(6)}`);updateButton()}
    map.on('click',event=>setPoint(event.latlng.lat,event.latlng.lng,false));
    for(const id of ['lat','lon']){$(id).addEventListener('input',()=>updateButton());$(id).addEventListener('change',()=>{if(valid()){const c=coordinates();setPoint(c.latitude,c.longitude)}})}
    async function request(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Location-Token':token,...options.headers}});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.message||`请求失败：${response.status}`);return data}
    async function check(){busy=true;updateButton();$('status').className='status busy';$('status').textContent='正在检查 USB 连接…';try{const data=await request('/api/status');connected=true;$('status').className='status good';$('status').textContent=data.message}catch(error){connected=false;$('status').className='status bad';$('status').textContent=error.message}finally{busy=false;updateButton()}}
    $('check').onclick=check;
    $('reveal').onclick=async()=>{busy=true;updateButton();showResult('正在请求显示开发者模式选项…');try{const data=await request('/api/reveal',{method:'POST',body:'{}'});showResult(data.message)}catch(error){showResult(error.message,true)}finally{busy=false;updateButton()}};
    $('set').onclick=async()=>{if(!valid())return;busy=true;updateButton();$('status').className='status busy';$('status').textContent='正在建立开发者通道并发送坐标…';showResult('首次设置可能需要准备开发者镜像，请稍候。');try{const c=coordinates();const data=await request('/api/set',{method:'POST',body:JSON.stringify(c)});connected=true;$('status').className='status good';$('status').textContent='模拟定位已发送，等待手机地图确认';showResult(data.message)}catch(error){$('status').className='status bad';$('status').textContent='设置失败';showResult(error.message,true)}finally{busy=false;updateButton()}};
    $('clear').onclick=async()=>{busy=true;updateButton();$('status').className='status busy';$('status').textContent='正在恢复真实定位…';try{const data=await request('/api/clear',{method:'POST',body:'{}'});connected=true;$('status').className='status good';$('status').textContent='恢复指令已发送，等待手机地图确认';showResult(data.message)}catch(error){$('status').className='status bad';$('status').textContent='恢复失败';showResult(error.message,true)}finally{busy=false;updateButton()}};
    check();
  </script>
</body>
</html>
